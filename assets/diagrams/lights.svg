<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"><rect width="1000" height="650" rx="20" fill="#20201d"/><style>text{font:18px system-ui,sans-serif;fill:#e7e2d7}.part{fill:#45453d;stroke:#c4beaf;stroke-width:4;stroke-linejoin:round}.line{fill:none;stroke:#c4beaf;stroke-width:8;stroke-linecap:round}.thin{fill:none;stroke:#c4beaf;stroke-width:3}.dark{fill:#20201d;stroke:#c4beaf;stroke-width:4}</style><text x="35" y="40" style="font-size:22px;font-weight:700">Front and rear lighting groups — illustrative</text><text x="35" y="68" style="font-size:15px;fill:#aaa797">Illustrative component guide · not the exact vehicle layout · not to scale</text><g><rect class="part" x="95" y="150" width="120" height="90" rx="12"/><rect class="part" x="305" y="150" width="120" height="90" rx="12"/><circle cx="155" cy="195" r="30" fill="#d59b3c"/><circle cx="365" cy="195" r="30" fill="#d59b3c"/></g><text x="265.0" y="314" text-anchor="middle">Front combination lamps + reflectors</text><g><circle class="part" cx="645" cy="200" r="40"/><circle class="part" cx="815" cy="200" r="40"/></g><text x="730.0" y="299" text-anchor="middle">Clear reverse lamps</text><g><rect class="part" x="105" y="435" width="85" height="40" rx="12"/><rect class="part" x="335" y="435" width="85" height="40" rx="12"/></g><text x="265.0" y="519" text-anchor="middle">Outer clearance lamps</text><g><circle class="part" cx="620" cy="445" r="32"/><circle class="part" cx="735" cy="445" r="32"/><circle class="part" cx="850" cy="445" r="32"/></g><text x="740.0" y="529" text-anchor="middle">Red tail / brake / indicator lamps</text></svg>