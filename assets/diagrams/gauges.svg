<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"><rect width="1000" height="650" rx="20" fill="#20201d"/><style>text{font:18px system-ui,sans-serif;fill:#e7e2d7}.part{fill:#45453d;stroke:#c4beaf;stroke-width:4;stroke-linejoin:round}.line{fill:none;stroke:#c4beaf;stroke-width:8;stroke-linecap:round}.thin{fill:none;stroke:#c4beaf;stroke-width:3}.dark{fill:#20201d;stroke:#c4beaf;stroke-width:4}</style><text x="35" y="40" style="font-size:22px;font-weight:700">Instrument gauges — illustrative, not live readings</text><text x="35" y="68" style="font-size:15px;fill:#aaa797">Illustrative component guide · not the exact vehicle layout · not to scale</text><g><circle class="part" cx="180" cy="220" r="70"/><path class="line" d="M180 220 L145 180"/></g><text x="180.0" y="329" text-anchor="middle">Oil pressure</text><g><circle class="part" cx="505" cy="220" r="70"/><path class="line" d="M505 220 L470 180"/></g><text x="505.0" y="329" text-anchor="middle">Water temperature</text><g><circle class="part" cx="830" cy="220" r="70"/><path class="line" d="M830 220 L795 180"/></g><text x="830.0" y="329" text-anchor="middle">Voltmeter</text><g><circle class="part" cx="180" cy="470" r="70"/><path class="line" d="M180 470 L145 430"/></g><text x="180.0" y="579" text-anchor="middle">Fuel level</text><g><circle class="part" cx="505" cy="470" r="70"/><path class="line" d="M505 470 L470 430"/></g><text x="505.0" y="579" text-anchor="middle">DEF level</text><g><circle class="part" cx="830" cy="470" r="70"/><path class="line" d="M830 470 L795 430 M830 470 L865 425"/></g><text x="830.0" y="579" text-anchor="middle">Primary / secondary air</text></svg>